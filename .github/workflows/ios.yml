name: iOS Build & TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      testflight:
        description: Signiert bauen und zu TestFlight hochladen
        type: boolean
        default: true
      runner:
        description: macOS Runner (bei Warteschlange ggf. wechseln)
        type: choice
        options: [xcode-27, macos-latest, macos-26]
        default: xcode-27

permissions:
  contents: read

jobs:
  validate-shared:
    name: Shared JSON & Test-Vektoren prüfen
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/validate_shared.py

  ios-build:
    name: iOS Build, Tests & optional TestFlight
    needs: validate-shared
    if: github.actor == github.repository_owner
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'xcode-27' }}
    env:
      SIGN: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Forks können über die Repository-Variable BUNDLE_ID ihre eigene App ID setzen.
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'io.github.cali1205.leseteppich' }}
    steps:
      - uses: actions/checkout@v5

      - name: Neuestes stabiles Xcode auswählen
        run: |
          XC=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          test -n "$XC" || XC=/Applications/Xcode.app
          sudo xcode-select -s "$XC" && xcodebuild -version

      - name: XcodeGen installieren & Projekt generieren
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml --project ios

      - name: Build & Unit-Tests (iOS Simulator, unsigniert)
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test \
            -project ios/Leseteppich.xcodeproj \
            -scheme Leseteppich \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { grep -E "error:|failed" build.log; tail -80 build.log; exit 1; }
          grep -E "warning: .*/Leseteppich/|Test Case .*(passed|failed)" build.log || true

      - name: App Store Connect API Key vorbereiten
        if: env.SIGN == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_ID" -a -n "$ASC_ISSUER_ID" -a -n "$TEAM_ID" -a -n "$ASC_KEY_P8" \
            || { echo "::error::Fehlende Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID (siehe README)"; exit 1; }
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          plutil -replace teamID -string "$TEAM_ID" ios/ExportOptions.plist

      - name: Release-Archiv bauen
        if: env.SIGN == 'true'
        run: |
          xcodebuild archive \
            -project ios/Leseteppich.xcodeproj \
            -scheme Leseteppich \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/Leseteppich.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_ENTITLEMENTS="Leseteppich/Leseteppich.entitlements" \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { sh scripts/redact.sh < "$RUNNER_TEMP/archive.log" | grep -E "error:|ARCHIVE FAILED" | tail -40; exit 1; }
          APP="$RUNNER_TEMP/Leseteppich.xcarchive/Products/Applications/Leseteppich.app"
          codesign --force --sign - --entitlements "ios/Leseteppich/Leseteppich.entitlements" --generate-entitlement-der "$APP"
          echo "Archive erfolgreich erstellt."

      - name: Zu TestFlight hochladen (Cloud-Signing ohne Mac)
        if: env.SIGN == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Leseteppich.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$RUNNER_TEMP/export.log" 2>&1 \
            || { sh scripts/redact.sh < "$RUNNER_TEMP/export.log" | grep -iE "error|fail" | tail -40; exit 1; }
          echo "Erfolgreich zu App Store Connect / TestFlight hochgeladen!"

      - name: Temporären API Key aufräumen
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
