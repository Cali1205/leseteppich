name: Leseteppich
options:
  bundleIdPrefix: io.github.cali1205
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_LANGUAGE: de

targets:
  Leseteppich:
    type: application
    platform: iOS
    sources:
      - path: Leseteppich
      - path: ../shared/content/leseteppiche.json
        buildPhase: resources
      - path: ../shared/content/wuerfellesen.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cali1205.leseteppich
        PRODUCT_NAME: Leseteppich
        # iPhone & iPad (1,2) so reading carpets work great on both devices
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Leseteppich/Leseteppich.entitlements
    info:
      path: Leseteppich/Info.plist
      properties:
        CFBundleDisplayName: Leseteppich
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Die App benötigt das Mikrofon, um vorgelesene Laute und Wörter zu erkennen und im Eltern-Stimm-Studio eigene Laute aufzunehmen.
        NSSpeechRecognitionUsageDescription: Die App nutzt die Spracherkennung (bevorzugt direkt auf dem Gerät), um beim Vorlesen der Leseteppiche direktes Feedback zu geben.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

  LeseteppichTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../shared/test-vectors/phonetic_matching.json
        buildPhase: resources
    dependencies:
      - target: Leseteppich

schemes:
  Leseteppich:
    build:
      targets:
        Leseteppich: all
        LeseteppichTests: [test]
    test:
      targets: [LeseteppichTests]
